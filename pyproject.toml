[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "insurance-qa-mcp-server"
version = "1.0.0"
description = "MCP server providing QA automation tools for insurance domain testing"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Maharshi Soni"}
]
keywords = ["mcp", "model-context-protocol", "qa", "insurance", "testing", "automation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.1.0",
]
analytics = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
]
bridges = [
    "testpilot-ai @ git+https://github.com/sonimaharshi1999/testpilot-ai.git",
    "promptguard-py @ git+https://github.com/sonimaharshi1999/promptguard.git",
    "embedkit-py @ git+https://github.com/sonimaharshi1999/embedkit.git",
]

[project.scripts]
insurance-qa-mcp = "insurance_qa_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks tests as slow running",
    "integration: marks integration tests",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.coverage.run]
source = ["insurance_qa_mcp"]

[tool.coverage.report]
show_missing = true
fail_under = 80
